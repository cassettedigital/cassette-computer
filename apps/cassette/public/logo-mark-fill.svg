        <path d="M11.798,13.012L20.213,13.012" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    </mask>
    <linearGradient id="mark" gradientUnits="userSpaceOnUse" x1="16" y1="8" x2="16" y2="24">
        <stop offset="0" stop-color="#f97408"/>
        <stop offset="1" stop-color="#fb4f29"/>
    </linearGradient>
    <path fill="url(#mark)" mask="url(#cassette-cut)" d="M6.5,6.9H25.5A4.6,4.6 0 0 1 30.1,11.5V20.5A4.6,4.6 0 0 1 25.5,25.1H6.5A4.6,4.6 0 0 1 1.9,20.5V11.5A4.6,4.6 0 0 1 6.5,6.9Z"/>
